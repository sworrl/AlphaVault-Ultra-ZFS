plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alphasteg.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.alphasteg.pro"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-Ultra-ZFS"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Screenshots/screen recording are blocked by FLAG_SECURE unless this is
        // set. Build with -PallowScreenshots to produce a capturable build for
        // docs; normal builds stay secure. The dev flavor forces it on.
        buildConfigField "boolean", "ALLOW_SCREENSHOTS",
            (project.hasProperty("allowScreenshots") ? "true" : "false")
        // Dev-only behavior (seed fake data, screenshots). Off for prod.
        buildConfigField "boolean", "IS_DEV", "false"
    }

    // Two copies from one source: `dev` for the emulator (installs alongside the
    // real app, screenshots enabled, seeds fake data for media capture) and
    // `prod`, the locked build that goes on a real device.
    flavorDimensions "distribution"
    productFlavors {
        prod {
            dimension "distribution"
            resValue "string", "app_name", "AlphaVault Ultra"
        }
        dev {
            dimension "distribution"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "AlphaVault Dev"
            buildConfigField "boolean", "ALLOW_SCREENSHOTS", "true"
            buildConfigField "boolean", "IS_DEV", "true"
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "AlphaVault-Ultra-ZFS-${variant.flavorName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.biometric:biometric:1.1.0'
    // Security keys (FIDO2 hmac-secret over USB-C and NFC) for the recovery keyslot.
    implementation 'com.yubico.yubikit:android:2.9.0'
    implementation 'com.yubico.yubikit:fido:2.9.0'
    testImplementation 'junit:junit:4.13.2'
    // Android stubs org.json in unit tests; use the real implementation there.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
